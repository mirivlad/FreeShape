name: Browser WASM experiment
on:
  push:
    branches: [experiment/browser-wasm]
  workflow_dispatch:
concurrency:
  group: browser-wasm-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build local static image
        run: docker build -f webcad/Dockerfile -t freeshape-web:test .
      - name: Start static server
        run: |
          docker run -d --name cad -p 8086:8080 freeshape-web:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8086/healthz && exit 0; sleep 1; done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tests
        working-directory: webcad
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual CAD in browser
        run: node webcad/smoke.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcad-workbench
          path: webcad-*.png
          if-no-files-found: ignore
      - name: Check branch tip before publication
        id: tip
        run: |
          if [ "$(git ls-remote origin refs/heads/experiment/browser-wasm | cut -f1)" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - name: Logs
        if: always()
        run: docker logs cad || true
      - name: Publish verified image
        if: github.repository == 'mirivlad/FreeShape' && steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag freeshape-web:test ghcr.io/mirivlad/freeshape-web:wasm-experiment
          docker tag freeshape-web:test ghcr.io/mirivlad/freeshape-web:wasm-0.3.1
          docker push ghcr.io/mirivlad/freeshape-web:wasm-0.3.1
          docker push ghcr.io/mirivlad/freeshape-web:wasm-experiment
