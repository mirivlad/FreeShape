name: Experimental smart snapping DEB

on:
  workflow_dispatch:
  push:
    branches: [feature/advanced-sketch-inferencing]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1 \
            libdbus-1-3 file dpkg-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.16" pytest
      - name: Check packaging scripts
        run: |
          bash -n packaging/linux/build_deb.sh
          bash -n packaging/linux/test_deb.sh
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("packaging/linux/freeshape.xml")
          PY
      - name: Test translation catalog
        run: |
          python -m compileall -q freeshape
          QT_QPA_PLATFORM=offscreen FREESHAPE_LANG=en python -m pytest -q tests/test_i18n.py tests/test_sketch_inference.py tests/test_sketch_snap.py tests/test_smart_snap.py tests/test_sketch_quick_tools.py tests/test_sketch_more_tools.py tests/test_normal_constraint.py
      - name: Build DEB and verify its contents
        run: |
          PYTHON=python bash packaging/linux/build_deb.sh
          bash packaging/linux/test_deb.sh dist/freeshape_*.deb
          dpkg-deb --contents dist/freeshape_*.deb | tail -20
      - name: Install DEB and test frozen application
        run: |
          sudo apt-get install -y ./dist/freeshape_*.deb
          freeshape --self-test "$RUNNER_TEMP/installed-selftest.txt"
          grep -qx OK "$RUNNER_TEMP/installed-selftest.txt"
          dpkg -s freeshape
      - uses: actions/upload-artifact@v4
        with:
          name: freeshape-deb-amd64
          path: dist/freeshape_*.deb
          if-no-files-found: error
  compatibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeshape-deb-amd64
          path: /tmp/freeshape-deb
      - name: Verify installation and non-GUI self-test
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/freeshape-deb/freeshape_*.deb
          freeshape --self-test /tmp/freeshape-selftest.txt
          grep -qx OK /tmp/freeshape-selftest.txt
          dpkg-query -W freeshape

  publish:
    if: github.repository == 'mirivlad/FreeShape' && github.ref == 'refs/heads/feature/advanced-sketch-inferencing'
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeshape-deb-amd64
          path: dist
      - name: Publish experimental package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum freeshape_*.deb > SHA256SUMS
          TAG=v2.6.0-4-snap1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Experimental release already exists; increment the revision for a new build."
            exit 1
          fi
          gh release create "$TAG" freeshape_*.deb SHA256SUMS \
            --target "$GITHUB_SHA" --title "FreeShape 2.6.0-4~snap1 — Advanced Sketch Inferencing" \
            --prerelease --latest=false --notes "Experimental fork build for desktop testing. Smart snap markers, midpoint/centre/quadrant/intersection targets, alignment guides, automatic line relationships and equal radius. View → Smart snapping to configure; hold Shift to bypass. Includes Russian UI. Back up projects before experimenting. Not a stable release. See docs/SMART_SNAPPING.md for scope and test cases."
