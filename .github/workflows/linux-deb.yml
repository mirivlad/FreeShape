name: Linux DEB (Debian and Ubuntu)

on:
  workflow_dispatch:
  push:
    branches: [master, feature/deb-packaging]
    paths:
      - "packaging/linux/**"
      - "packaging/freeshape.spec"
      - "freeshape/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/linux-deb.yml"
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1 \
            libdbus-1-3 file dpkg-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.16" pytest
      - name: Check packaging scripts
        run: |
          bash -n packaging/linux/build_deb.sh
          bash -n packaging/linux/test_deb.sh
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("packaging/linux/freeshape.xml")
          PY
      - name: Test translation catalog
        run: |
          python -m compileall -q freeshape
          QT_QPA_PLATFORM=offscreen python -m pytest -q tests/test_i18n.py
      - name: Build DEB and verify its contents
        run: |
          PYTHON=python bash packaging/linux/build_deb.sh
          bash packaging/linux/test_deb.sh dist/freeshape_*.deb
          dpkg-deb --contents dist/freeshape_*.deb | tail -20
      - name: Install DEB and test frozen application
        run: |
          sudo apt-get install -y ./dist/freeshape_*.deb
          freeshape --self-test "$RUNNER_TEMP/installed-selftest.txt"
          grep -qx OK "$RUNNER_TEMP/installed-selftest.txt"
          dpkg -s freeshape
      - uses: actions/upload-artifact@v4
        with:
          name: freeshape-deb-amd64
          path: dist/freeshape_*.deb
          if-no-files-found: error
  compatibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeshape-deb-amd64
          path: /tmp/freeshape-deb
      - name: Verify installation and non-GUI self-test
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/freeshape-deb/freeshape_*.deb
          freeshape --self-test /tmp/freeshape-selftest.txt
          grep -qx OK /tmp/freeshape-selftest.txt
          dpkg-query -W freeshape

  publish:
    if: github.event_name == 'release' || (github.repository == 'mirivlad/FreeShape' && github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[publish-deb]'))
    needs: [build, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freeshape-deb-amd64
          path: dist
      - name: Create or update the validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXISTING_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum freeshape_*.deb > SHA256SUMS
          if [ -n "$EXISTING_TAG" ]; then
            gh release upload "$EXISTING_TAG" freeshape_*.deb SHA256SUMS --clobber
          else
            VERSION="$(dpkg-deb --field freeshape_*.deb Version)"
            TAG="v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; refusing to replace a published version."
              exit 1
            fi
            cat > /tmp/freeshape-release-notes.md <<'NOTES'
          ## FreeShape for Debian and Ubuntu (amd64)

          Unofficial fork build based on upstream FreeShape 2.6.0, with native DEB packaging
          and expanded Russian localization.

          - Download the .deb below and install with sudo apt install ./freeshape_*.deb.
          - Choose View → Language → Русский, then restart; system language is selected by default.
          - Russian translation covers CAD operation parameters, sketch hints, assembly and drawing controls,
            history, configuration, shortcuts and menus (over 800 catalog entries).
            Some dynamic messages and advanced controls still remain in English.
          - The package and geometry/localization self-test are checked on Debian 12/13 and
            Ubuntu 24.04/26.04. Interactive desktop testing is still recommended.
          - SHA256SUMS contains the SHA-256 checksum of the package.

          Source: this tag in the mirivlad/FreeShape fork; GPL-3.0-or-later.
          NOTES
            gh release create "$TAG" freeshape_*.deb SHA256SUMS \
              --target "$GITHUB_SHA" --title "FreeShape $VERSION — Debian/Ubuntu + Russian UI" \
              --notes-file /tmp/freeshape-release-notes.md --latest
          fi
