name: Translation validation

on:
  workflow_dispatch:
  push:
    branches: [feature/ru-localization]
  pull_request:
    branches: [master]
    paths:
      - "freeshape/i18n.py"
      - "freeshape/locale/**"
      - "freeshape/ui/**"
      - "tests/test_i18n.py"
      - ".github/workflows/localization.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m compileall -q freeshape
      - run: python -m pytest -q tests/test_i18n.py
